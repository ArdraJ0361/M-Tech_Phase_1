# Pilot experiment — XL-Sum Summarization with LoRA
# -------------------------------------------------------
# GUIDE FEEDBACK ADDRESSED:
#   A. XL-Sum provides official train/validation/test splits — used directly.
#      No custom re-splitting. val_samples and test_samples are drawn from
#      their respective official HF splits (not the same split).
#   B. model_variant: "base" — document zero-shot limitation in results.
#   C. Checkpoint selected by validation ROUGE-L only — NOT test ROUGE-L.
#   D. metric_for_best_model: "eval_loss" (validation, never test) explicitly set.

experiment_name: "xlsum_summarization_lora_pilot"
task: "summarization"
# Phase 1 — second pilot (after SQuAD v2) — text-native, no OCR required
# GUIDE FEEDBACK A: XL-Sum is Phase 1, NOT Phase 2. SQuAD v2 runs first.
#   Phase 2 covers OCR-dependent tasks ONLY: RVL-CDIP, DocVQA.
# GUIDE FEEDBACK D: Phase 1 objective = evaluate PEFT on text-based tasks.
#   These are text-native pilots, NOT full visual document understanding.
#   Scanned-document extraction/classification are investigated in Phase 2.
# Status: Data pipeline VALIDATED | Training PENDING | Evaluation PENDING

# Model
model_name_or_path: "Qwen/Qwen1.5-0.5B"
tokenizer_name_or_path: null
# MUST match llm_baseline config — "base" vs "instruct" must be consistent
model_variant: "base"
use_flash_attention: false

# Quantization
load_in_bits: null   # null = bf16/fp16, 4 = QLoRA

# LoRA / PEFT configuration
peft:
  method: "lora"
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset
# XL-Sum has official train / validation / test splits — all used directly.
# val_samples drawn from HF "validation" split.
# test_samples drawn from HF "test" split.
# No overlap possible — separate HF splits.
dataset:
  name: "csebuetnlp/xlsum"
  version: "default"
  subset: "english"
  text_column: "text"
  summary_column: "summary"
  max_source_length: 512
  max_target_length: 128
  train_samples: 5000     # from HF "train" split
  val_samples: 500        # from HF "validation" split — used for checkpoint selection
  test_samples: 500       # from HF "test" split — held out, not used during training
  # IMPORTANT: same seed as pilot_squad_qa.yaml ensures reproducible selection

training:
  output_dir: "experiments/xlsum_summarization"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  # GUIDE FEEDBACK D: checkpoint selected by validation ROUGE-L only.
  # This is the metric measured on the validation split during training.
  # Test ROUGE-L is only computed after the best checkpoint is selected.
  metric_for_best_model: "eval_loss"
  # Must match pilot_squad_qa.yaml for reproducible comparison
  seed: 42

evaluation:
  metrics:
    - "rouge1"
    - "rouge2"
    - "rougeL"
  record_efficiency: true

results_csv: "experiments/results.csv"
