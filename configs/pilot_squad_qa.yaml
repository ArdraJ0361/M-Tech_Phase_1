# Pilot experiment — SQuAD Question Answering with LoRA
# -------------------------------------------------------
# GUIDE FEEDBACK ADDRESSED:
#   B. model_variant is now explicit. Use "base" (Qwen1.5-0.5B) for the SLM.
#      The LLM baseline config must use the SAME variant type for a fair comparison.
#      Never mix base and instruct variants across the 3-way comparison table.
#   C. seed is set here and used for deterministic test split selection.
#      All three comparison runs (base SLM, PEFT-SLM, LLM) must use seed: 42.
#   C. dataset version is documented for reproducibility.

experiment_name: "squad_qa_lora_pilot"
task: "qa"                          # qa | summarization | classification | extraction
# Phase 1 — FIRST training pilot — text-native, no OCR required
# GUIDE FEEDBACK D: Phase 1 objective = evaluate whether PEFT fine-tuning improves
#   a small language model on selected TEXT-BASED tasks, and compare task quality
#   and computational efficiency with a larger model. SQuAD v2 uses Wikipedia
#   passages — these are text-native pilots, NOT full visual document understanding.
#   Scanned-document extraction and classification are Phase 2.
# Status: Data pipeline VALIDATED | Training PENDING | Evaluation PENDING

# Model
model_name_or_path: "Qwen/Qwen1.5-0.5B"   # 500M params — the SLM we PEFT-tune
tokenizer_name_or_path: null               # null = same as model
# IMPORTANT: Set model_variant consistently across ALL THREE comparison configs.
# Options: "base" or "instruct". Mixing variants makes zero-shot comparison unfair.
model_variant: "base"
use_flash_attention: false

# Quantization (set to 4 for QLoRA on limited VRAM)
load_in_bits: null     # null = bf16/fp16, 8 = INT8, 4 = QLoRA

# LoRA / PEFT configuration
peft:
  method: "lora"          # lora | qlora
  r: 8                    # LoRA rank
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:          # null = auto-detect; or list module names
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset
dataset:
  name: "rajpurkar/squad_v2"   # HuggingFace Hub id (bare "squad_v2" is rejected by huggingface_hub)
  version: "default"      # document dataset version for reproducibility
  subset: null
  text_column: "context"
  question_column: "question"
  answer_column: "answers"
  max_source_length: 512
  max_target_length: 64
  train_samples: 5000     # null = full dataset
  val_samples: 500
  # IMPORTANT: test_samples uses seed from training.seed for deterministic selection.
  # Use the SAME seed in the LLM baseline config to evaluate on identical examples.
  test_samples: 500

# Training
training:
  output_dir: "experiments/squad_qa"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  # Use validation F1 (NOT test F1) for checkpoint selection — guide feedback C.
  metric_for_best_model: "eval_f1"
  # CRITICAL: This seed controls test split selection.
  # Must be identical in pilot_squad_qa.yaml AND llm_baseline_qwen7b.yaml
  # so both models are evaluated on the exact same 500 test examples.
  seed: 42

# Evaluation
evaluation:
  metrics:
    - "exact_match"
    - "f1"
  record_efficiency: true   # log time + GPU memory

# Experiment log
results_csv: "experiments/results.csv"
