# Pilot experiment — DocFinQA Financial Question Answering with LoRA
# -------------------------------------------------------
# Dataset: kensho/DocFinQA — 7,437 QA pairs from real SEC 10-K filings
# Same task type as SQuAD v2 (extractive QA) — fits the existing pipeline unchanged.
# Reference: https://arxiv.org/abs/2401.06915

experiment_name: "docfinqa_lora_pilot"
task: "qa"

# Model — same as SQuAD pilot for direct comparison
model_name_or_path: "Qwen/Qwen1.5-0.5B"
tokenizer_name_or_path: null
model_variant: "base"
use_flash_attention: false

# Quantization
load_in_bits: null     # null = bf16/fp16, 4 = QLoRA on limited VRAM

# LoRA — same hyperparameters as SQuAD pilot for fair comparison
peft:
  method: "lora"
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset
# DocFinQA has official train/test splits on HuggingFace.
# Column names: "context", "question", "answers" — same as SQuAD v2.
dataset:
  name: "kensho/DocFinQA"
  version: "default"
  subset: null
  text_column: "context"
  question_column: "question"
  answer_column: "answers"
  max_source_length: 512
  max_target_length: 64
  train_samples: 5000
  val_samples: 500
  test_samples: 500

# Training — same as SQuAD pilot
training:
  output_dir: "experiments/docfinqa"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  seed: 42

# Evaluation
evaluation:
  metrics:
    - "exact_match"
    - "f1"
  record_efficiency: true

# Experiment log
results_csv: "experiments/results.csv"
