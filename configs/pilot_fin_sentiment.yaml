# Pilot experiment — Financial Sentiment Classification with LoRA
# -------------------------------------------------------
# Dataset: JanosAudran/financial-reports-sec
# SEC 10-K filing sentences labelled positive/negative by market reaction.
# Reference: https://huggingface.co/datasets/JanosAudran/financial-reports-sec

experiment_name: "fin_sentiment_lora_pilot"
task: "classification"

# Model
model_name_or_path: "Qwen/Qwen1.5-0.5B"
tokenizer_name_or_path: null
model_variant: "base"
use_flash_attention: false

# Quantization
load_in_bits: null

# LoRA
peft:
  method: "lora"
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset
# Use "small_full" config: 200k/20k/20k sentences with full metadata.
# text_column: "sentence" — the SEC filing sentence to classify.
# label_column: "labels" — dict with keys "1d", "5d", "30d"; use "1d" (1-day market reaction).
dataset:
  name: "JanosAudran/financial-reports-sec"
  version: "small_full"
  subset: null
  text_column: "sentence"
  label_column: "labels"
  label_key: "1d"             # use 1-day market reaction window
  max_source_length: 256      # sentences are short; 256 is sufficient
  max_target_length: 16
  train_samples: 5000
  val_samples: 500
  test_samples: 500

# Training
training:
  output_dir: "experiments/fin_sentiment"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  seed: 42

# Evaluation
evaluation:
  metrics:
    - "accuracy"
    - "f1"
  record_efficiency: true

# Experiment log
results_csv: "experiments/results.csv"
